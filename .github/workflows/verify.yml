# verify.yml — run the repo gate somewhere other than a maintainer session.
#
#   bun run verify  =  doctor --quick → contract-check → tsc --noEmit
#                      → eslint --quiet → scoped bun tests → agent-ts tests
#
# Doctor on CI:
#   - `doctor --quick` never probes host services — those probes are full-mode
#     only, and informational even there (they never fail the gate).
#   - CONTROL_DECK_DOCTOR_CI=1 (set on the verify step) downgrades the checks
#     that cannot hold on a fresh runner — uv/process-compose binaries,
#     .venv-* python sidecars, and external repo checkouts like llama.cpp —
#     from hard fail to informational skip. node/bun still hard-gate.
#
# Toolchain pins mirror mise.toml (node 22.20.0, bun 1.3.4) and package.json
# engines (node >=22 <23, bun >=1.3) — keep them in sync when the pins move.
# Node is required even though the repo is bun-only: the postinstall hook
# (scripts/copy-vad-assets.cjs) runs under node.

name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0 # mise.toml pin; engines allow >=22 <23

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4 # mise.toml + packageManager pin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repo gate (doctor → contracts → types → lint → tests)
        run: bun run verify
        env:
          CONTROL_DECK_DOCTOR_CI: "1"

      - name: Eval floor gate (latest recorded agent-work run vs baseline)
        run: bun scripts/eval-gate.ts

      - name: Hermetic eval subset (offline; live probes SKIPped)
        run: bun scripts/mcp-tool-eval.ts --mode hermetic

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-eval-artifacts
          path: artifacts/mcp-evals/
          if-no-files-found: ignore
